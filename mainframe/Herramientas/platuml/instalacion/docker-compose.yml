services:
  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: plantuml_custom
    ports:
      - "8080:8080"  # Cambia el primer 8080 si quieres otro puerto en tu PC
    environment:
      - BASE_URL=plantuml # Prefijo de la URL (opcional)
      - PLANTUML_LIMIT_SIZE=4096 # Limita la resolución de imagen para evitar crashes
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always